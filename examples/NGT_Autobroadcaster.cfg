## Example configuration for NGT AutoBroadcaster 2.0.0
## The actual generated file will be BepInEx/config/NGT_Autobroadcaster.cfg

[Default Settings]

## Master switch.
EnableBroadcasting = true

## Number of Message XX sections loaded below.
AutoBroadcastCount = 4

## Extra scheduler / RPC logging.
DebugLogging = false

[Message 01]
Enabled = true
MessageText = Welcome to the server! Be respectful and have fun.
MessageType = Alert
ScheduledMinuteOfHour = 0
MessageTime = 5

[Message 02]
Enabled = true
MessageText = Join our Discord to stay connected with the community.
MessageType = Chat
ScheduledMinuteOfHour = 15
MessageTime = 5

[Message 03]
Enabled = true
MessageText = Remember to label portals and storage so everyone can find things.
MessageType = Both
ScheduledMinuteOfHour = 30
MessageTime = 6

[Message 04]
Enabled = true
MessageText = Please report server problems to an admin.
MessageType = Alert
ScheduledMinuteOfHour = 45
MessageTime = 5
